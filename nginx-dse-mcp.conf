# Nginx reverse proxy configuration for DSE Analysis MCP Server
# 
# Usage:
#   1. Edit server_name and SSL certificate paths
#   2. Copy to /etc/nginx/sites-available/dse-mcp
#   3. sudo ln -s /etc/nginx/sites-available/dse-mcp /etc/nginx/sites-enabled/
#   4. sudo nginx -t
#   5. sudo systemctl restart nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dse-mcp.example.com;  # ← Change this to your domain

    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name dse-mcp.example.com;  # ← Change this to your domain

    # SSL certificates (get from Let's Encrypt with Certbot)
    ssl_certificate /etc/letsencrypt/live/dse-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dse-mcp.example.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/dse-mcp-access.log;
    error_log /var/log/nginx/dse-mcp-error.log;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # Rate limiting (optional: max 10 requests/second per IP)
    limit_req_zone $binary_remote_addr zone=dse_limit:10m rate=10r/s;
    limit_req zone=dse_limit burst=20;

    # Reverse proxy to local MCP server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Upgrade headers (for WebSocket support)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
