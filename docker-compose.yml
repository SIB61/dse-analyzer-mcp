version: '3.8'

services:
  # DSE Analysis MCP Server
  dse-mcp:
    image: ghcr.io/sib61/dse-analyzer:main
    container_name: dse-mcp
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - dse-analyzer:/app/mcp-configs
      - dse-analyzer-opencode:/root/.config/opencode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import requests; requests.get('http://localhost:8765')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dse-analyzer:
  dse-analyzer-opencode:
