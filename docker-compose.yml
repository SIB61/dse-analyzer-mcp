services:
  dse-analyzer-mcp:
    image: ghcr.io/sib61/dse-analyzer-mcp:main
    container_name: dse-analyzer-mcp
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import requests; requests.get('http://localhost:8765')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
